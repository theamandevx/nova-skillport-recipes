# DRAFT — conceptual authoring shape from Skill Port Recipe Standard v1 §2.6; pending validation against Skill Port's approved JSON Schema.
manifest:
  package:
    app_id: "nova.calendar"
    name: "Nova — Calendar and meetings"
    version: "0.1.0"
    owner: "TBD (publisher ID assigned at Skill Port verification)"
    status: "draft"
    description: "Before each external meeting, deliver an owner-only brief built from the owner's own records plus cited public sources, with three talking points."
    compatibility:
      recipe_contract: "1.x"
      runtimes: ["TBD"]
      protocols: ["internal", "MCP"]
    installation:
      mode: "user"
      prerequisites:
        - "Calendar store with a prep-due query and a once-per-booking marker"
        - "Contact directory, CRM, mail metadata, minutes history and assistant memory"
        - "Cited web-research capability and a mid-tier LLM"
        - "Owner notification channel; owner's organisation domains and time zone configured"
      health_check_ref: null

  capabilities:
    - capability_id: "nova.meetings.prep"
      name: "Meeting prep tracking"
      description: "Find upcoming external meetings that need a brief and record when one was delivered."
      intent_examples: ["prep my 11:00"]
      input_schema_ref: "schema://nova/meeting-prep-brief/run-config@0.1.0"
      output_schema_ref: "schema://nova/meeting-prep-brief/due-meeting@0.1.0"
      risk_class: "low"
      preconditions: ["owner configuration valid"]
      postconditions: ["at most one brief per booking"]
      tools:
        - tool_id: "nova.meetings.prep.due"
          name: "Prep due"
          description: "Upcoming external meetings inside the lead window that have no prep marker."
          invocation: {protocol: "internal", binding_ref: "binding://nova/meetings/prep-due", operation: "due"}
          input_schema_ref: "schema://nova/meeting-prep-brief/run-config@0.1.0"
          output_schema_ref: "schema://nova/meeting-prep-brief/due-meeting@0.1.0"
          objects:
            - {object_id: "nova.calendar.booking_record", name: "Booking", description: "One meeting on the owner's calendar", operations: ["read"], scope_rules: ["owner's tenant only", "future meetings inside the lead window"], schema_ref: "schema://nova/meeting-prep-brief/due-meeting@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/meeting-prep-brief/run-config@0.1.0", output_schema_ref: "schema://nova/meeting-prep-brief/due-meeting@0.1.0", constraints: ["read-only", "excludes marked bookings"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["calendar:bookings:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 15, max_attempts: 3, rate_limits: ["one scheduled run at a time"], error_codes: ["invalid_config"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["every item starts after now and inside the window", "no marked booking returned"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}
        - tool_id: "nova.meetings.prep.mark_done"
          name: "Mark prepared"
          description: "Create the once-per-booking marker after delivery."
          invocation: {protocol: "internal", binding_ref: "binding://nova/meetings/prep-done", operation: "mark_done"}
          input_schema_ref: "schema://nova/meeting-prep-brief/prep-marker@0.1.0"
          output_schema_ref: "schema://nova/meeting-prep-brief/prep-marker@0.1.0"
          objects:
            - {object_id: "nova.meetings.prep_marker", name: "Prep marker", description: "Proof that a booking's brief was delivered", operations: ["create"], scope_rules: ["unique per booking", "only after a delivery receipt"], schema_ref: "schema://nova/meeting-prep-brief/prep-marker@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/meeting-prep-brief/prep-marker@0.1.0", output_schema_ref: "schema://nova/meeting-prep-brief/prep-marker@0.1.0", constraints: ["create once"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["meetings:prep:write"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["marker created"], idempotency: "required", timeout_seconds: 10, max_attempts: 3, rate_limits: [], error_codes: ["duplicate"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["prep.due no longer returns the booking"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.calendar.booking"
      name: "Bookings"
      description: "Read the owner's bookings to confirm a meeting is still on."
      intent_examples: []
      input_schema_ref: "schema://nova/meeting-prep-brief/booking-query@0.1.0"
      output_schema_ref: "schema://nova/meeting-prep-brief/due-meeting@0.1.0"
      risk_class: "low"
      preconditions: ["owner identified"]
      postconditions: ["current status and start time returned"]
      tools:
        - tool_id: "nova.calendar.booking.list"
          name: "List bookings"
          description: "Re-check a booking's status and start time (MCP list_bookings / upcoming_bookings)."
          invocation: {protocol: "MCP", binding_ref: "binding://nova/calendar/list-bookings", operation: "list_bookings"}
          input_schema_ref: "schema://nova/meeting-prep-brief/booking-query@0.1.0"
          output_schema_ref: "schema://nova/meeting-prep-brief/due-meeting@0.1.0"
          objects:
            - {object_id: "nova.calendar.booking_record", name: "Booking", description: "One meeting on the owner's calendar", operations: ["read"], scope_rules: ["owner's tenant only"], schema_ref: "schema://nova/meeting-prep-brief/due-meeting@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/meeting-prep-brief/booking-query@0.1.0", output_schema_ref: "schema://nova/meeting-prep-brief/due-meeting@0.1.0", constraints: ["read-only"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["calendar:bookings:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 10, max_attempts: 3, rate_limits: [], error_codes: ["not_found"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["status and start time current"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.contacts.directory"
      name: "Contact directory"
      description: "Resolve an attendee to a known contact from approved sources."
      intent_examples: []
      input_schema_ref: "schema://nova/meeting-prep-brief/contact-query@0.1.0"
      output_schema_ref: "schema://nova/meeting-prep-brief/contact@0.1.0"
      risk_class: "medium"
      preconditions: ["owner identified"]
      postconditions: ["identity confidence assigned"]
      tools:
        - tool_id: "nova.contacts.directory.lookup"
          name: "Look up contact"
          description: "Assistant memory, then the contact directory; ask the user only on demand. Email match wins over name match."
          invocation: {protocol: "internal", binding_ref: "binding://nova/contacts/lookup", operation: "lookup"}
          input_schema_ref: "schema://nova/meeting-prep-brief/contact-query@0.1.0"
          output_schema_ref: "schema://nova/meeting-prep-brief/contact@0.1.0"
          objects:
            - {object_id: "nova.contacts.contact", name: "Contact", description: "A person known to the owner", operations: ["read"], scope_rules: ["owner's contacts only"], schema_ref: "schema://nova/meeting-prep-brief/contact@0.1.0"}
          variants:
            - {variant_id: "memory", description: "Assistant memory (read-only), tried first", compatible_environments: [], input_schema_ref: "schema://nova/meeting-prep-brief/contact-query@0.1.0", output_schema_ref: "schema://nova/meeting-prep-brief/contact@0.1.0", constraints: ["read-only"], fallback_variant_id: "directory"}
            - {variant_id: "directory", description: "Contact directory (read-only), tried second", compatible_environments: [], input_schema_ref: "schema://nova/meeting-prep-brief/contact-query@0.1.0", output_schema_ref: "schema://nova/meeting-prep-brief/contact@0.1.0", constraints: ["read-only"], fallback_variant_id: "ask-user"}
            - {variant_id: "ask-user", description: "Human-assisted; eligible only for on-demand runs, never in scheduled runs", compatible_environments: ["on-demand"], input_schema_ref: "schema://nova/meeting-prep-brief/contact-query@0.1.0", output_schema_ref: "schema://nova/meeting-prep-brief/contact@0.1.0", constraints: ["one question only", "not in scheduled runs"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["contacts:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 10, max_attempts: 3, rate_limits: [], error_codes: ["not_found", "ambiguous"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["email never derived from a name", "ambiguity reported, not resolved by guessing"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.meetings.context"
      name: "Attendee context"
      description: "Gather the owner's own context about an attendee from CRM, mail metadata, minutes history and memory."
      intent_examples: ["what do I know about John Roe"]
      input_schema_ref: "schema://nova/meeting-prep-brief/context-query@0.1.0"
      output_schema_ref: "schema://nova/meeting-prep-brief/context-bundle@0.1.0"
      risk_class: "medium"
      preconditions: ["attendee email known"]
      postconditions: ["every item labelled with source and date", "gaps named"]
      tools:
        - tool_id: "nova.meetings.context.gather"
          name: "Gather context"
          description: "Run all eligible source variants; each failure becomes a named gap; no variant stands in for another."
          invocation: {protocol: "internal", binding_ref: "binding://nova/meetings/context", operation: "gather"}
          input_schema_ref: "schema://nova/meeting-prep-brief/context-query@0.1.0"
          output_schema_ref: "schema://nova/meeting-prep-brief/context-bundle@0.1.0"
          objects:
            - {object_id: "nova.crm.contact_record", name: "CRM record and touches", description: "Lead or contact record with logged touches", operations: ["read"], scope_rules: ["owner's CRM only"], schema_ref: "schema://nova/meeting-prep-brief/context-bundle@0.1.0"}
            - {object_id: "nova.mail.message_metadata", name: "Mail metadata", description: "Subject, date, direction and participants of a message", operations: ["read"], scope_rules: ["no message bodies", "owner's mailboxes only"], schema_ref: "schema://nova/meeting-prep-brief/context-bundle@0.1.0"}
            - {object_id: "nova.minutes.session", name: "Minutes session", description: "Summary points, decisions and open actions of a past meeting", operations: ["read"], scope_rules: ["owner's minutes only"], schema_ref: "schema://nova/meeting-prep-brief/context-bundle@0.1.0"}
            - {object_id: "nova.memory.note", name: "Memory note", description: "An owner note mentioning the attendee or organisation", operations: ["read"], scope_rules: ["owner's memory only"], schema_ref: "schema://nova/meeting-prep-brief/context-bundle@0.1.0"}
          variants:
            - {variant_id: "crm", description: "Lead or contact record and touches", compatible_environments: [], input_schema_ref: "schema://nova/meeting-prep-brief/context-query@0.1.0", output_schema_ref: "schema://nova/meeting-prep-brief/context-bundle@0.1.0", constraints: ["read-only"], fallback_variant_id: null}
            - {variant_id: "mail-metadata", description: "Subjects, dates and participants only", compatible_environments: [], input_schema_ref: "schema://nova/meeting-prep-brief/context-query@0.1.0", output_schema_ref: "schema://nova/meeting-prep-brief/context-bundle@0.1.0", constraints: ["read-only", "never bodies"], fallback_variant_id: null}
            - {variant_id: "minutes-history", description: "Prior meeting minutes with the attendee", compatible_environments: [], input_schema_ref: "schema://nova/meeting-prep-brief/context-query@0.1.0", output_schema_ref: "schema://nova/meeting-prep-brief/context-bundle@0.1.0", constraints: ["read-only"], fallback_variant_id: null}
            - {variant_id: "memory", description: "Owner's saved notes", compatible_environments: [], input_schema_ref: "schema://nova/meeting-prep-brief/context-query@0.1.0", output_schema_ref: "schema://nova/meeting-prep-brief/context-bundle@0.1.0", constraints: ["read-only"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["crm:read", "mail:metadata:read", "minutes:read", "memory:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 15, max_attempts: 3, rate_limits: [], error_codes: ["source_unavailable", "permission_denied"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["no body field present", "every item has source and date"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.research.web"
      name: "Cited web research"
      description: "Self-hosted metasearch, page fetch and LLM synthesis; every claim carries a URL and retrieval date; saved to the owner's research store."
      intent_examples: []
      input_schema_ref: "schema://nova/meeting-prep-brief/research-query@0.1.0"
      output_schema_ref: "schema://nova/meeting-prep-brief/public-claim@0.1.0"
      risk_class: "medium"
      preconditions: ["public research enabled", "professional context only"]
      postconditions: ["every claim cited"]
      tools:
        - tool_id: "nova.research.web.brief"
          name: "Research brief"
          description: "Return up to N cited professional-context claims about a person and organisation; fetched content is untrusted data."
          invocation: {protocol: "internal", binding_ref: "binding://nova/research/web-brief", operation: "brief"}
          input_schema_ref: "schema://nova/meeting-prep-brief/research-query@0.1.0"
          output_schema_ref: "schema://nova/meeting-prep-brief/public-claim@0.1.0"
          objects:
            - {object_id: "nova.research.record", name: "Research record", description: "Saved claims with sources", operations: ["create"], scope_rules: ["owner's research store only", "no sensitive categories"], schema_ref: "schema://nova/meeting-prep-brief/public-claim@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/meeting-prep-brief/research-query@0.1.0", output_schema_ref: "schema://nova/meeting-prep-brief/public-claim@0.1.0", constraints: ["professional context only", "max_public_sources pages"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["research:web", "research:write"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["outbound search and page fetch", "research record created"], idempotency: "recommended", timeout_seconds: 60, max_attempts: 2, rate_limits: ["search backend limits"], error_codes: ["timeout", "no_results", "fetch_failed"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["every claim has source_url and retrieved_at", "sensitive-category filter passes"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.notify.owner"
      name: "Owner notification"
      description: "Deliver a message to the owner's own channel."
      intent_examples: []
      input_schema_ref: "schema://nova/meeting-prep-brief/prep-brief@0.1.0"
      output_schema_ref: "schema://nova/meeting-prep-brief/delivery@0.1.0"
      risk_class: "low"
      preconditions: ["owner channel configured"]
      postconditions: ["delivery receipt"]
      tools:
        - tool_id: "nova.notify.owner.send"
          name: "Notify owner"
          description: "Send the brief to the owner only, as plain text."
          invocation: {protocol: "internal", binding_ref: "binding://nova/notify/owner", operation: "send"}
          input_schema_ref: "schema://nova/meeting-prep-brief/prep-brief@0.1.0"
          output_schema_ref: "schema://nova/meeting-prep-brief/delivery@0.1.0"
          objects:
            - {object_id: "nova.notify.message", name: "Owner message", description: "A message to the owner", operations: ["create"], scope_rules: ["owner channel only"], schema_ref: "schema://nova/meeting-prep-brief/delivery@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/meeting-prep-brief/prep-brief@0.1.0", output_schema_ref: "schema://nova/meeting-prep-brief/delivery@0.1.0", constraints: ["owner only", "plain text"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["notify:owner"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["message delivered to the owner"], idempotency: "required", timeout_seconds: 15, max_attempts: 3, rate_limits: [], error_codes: ["channel_unavailable"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["delivery receipt received"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

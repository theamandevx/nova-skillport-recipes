# DRAFT — conceptual authoring shape from Skill Port Recipe Standard v1 §2.6; pending validation against Skill Port's approved JSON Schema.
manifest:
  package:
    app_id: "nova.comms"
    name: "Nova — Calls and messages"
    version: "0.1.0"
    owner: "TBD (publisher ID assigned at Skill Port verification)"
    status: "draft"
    description: "Draft, check and approve one WhatsApp message; send it only after a yes through the variant its purpose allows, or hand it to the user."
    compatibility:
      recipe_contract: "1.x"
      runtimes: ["TBD"]
      protocols: ["internal", "OpenAPI"]
    installation:
      mode: "user"
      prerequisites:
        - "LLM for drafting"
        - "Contact directory and an owner notification channel"
        - "Personal sends: a paired linked-device session and a per-user outbound allowlist"
        - "Customer-facing sends: WhatsApp Business Platform with a registered number, approved templates and opt-in records (not built)"
      health_check_ref: null

  capabilities:
    - capability_id: "nova.contacts.directory"
      name: "Contact directory"
      description: "Find a person's WhatsApp number from approved sources."
      intent_examples: ["WhatsApp Jane", "message Jane on WhatsApp"]
      input_schema_ref: "schema://nova/prepare-a-whatsapp-message/contact-query@0.1.0"
      output_schema_ref: "schema://nova/prepare-a-whatsapp-message/contact@0.1.0"
      risk_class: "medium"
      preconditions: ["requesting user identified"]
      postconditions: ["exactly one contact returned, or none"]
      tools:
        - tool_id: "nova.contacts.directory.lookup"
          name: "Look up contact"
          description: "Search assistant memory, then the contact directory, then ask the user once."
          invocation: {protocol: "internal", binding_ref: "binding://nova/contacts/lookup", operation: "lookup"}
          input_schema_ref: "schema://nova/prepare-a-whatsapp-message/contact-query@0.1.0"
          output_schema_ref: "schema://nova/prepare-a-whatsapp-message/contact@0.1.0"
          objects:
            - {object_id: "nova.contacts.contact", name: "Contact", description: "A person and phone number owned by the user", operations: ["read"], scope_rules: ["requesting user's contacts only"], schema_ref: "schema://nova/prepare-a-whatsapp-message/contact@0.1.0"}
          variants:
            - {variant_id: "memory", description: "Assistant memory (read-only), tried first", compatible_environments: [], input_schema_ref: "schema://nova/prepare-a-whatsapp-message/contact-query@0.1.0", output_schema_ref: "schema://nova/prepare-a-whatsapp-message/contact@0.1.0", constraints: ["read-only"], fallback_variant_id: "directory"}
            - {variant_id: "directory", description: "Contact directory (read-only), tried second", compatible_environments: [], input_schema_ref: "schema://nova/prepare-a-whatsapp-message/contact-query@0.1.0", output_schema_ref: "schema://nova/prepare-a-whatsapp-message/contact@0.1.0", constraints: ["read-only"], fallback_variant_id: "ask-user"}
            - {variant_id: "ask-user", description: "Human-assisted: ask the user once; never guess", compatible_environments: [], input_schema_ref: "schema://nova/prepare-a-whatsapp-message/contact-query@0.1.0", output_schema_ref: "schema://nova/prepare-a-whatsapp-message/contact@0.1.0", constraints: ["one question only"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["contacts:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 10, max_attempts: 3, rate_limits: [], error_codes: ["not_found", "ambiguous", "invalid_number"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["phone_e164 is a valid E.164 number", "exactly one match"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.comms.whatsapp.channel"
      name: "WhatsApp channel readiness"
      description: "Report linked-device session state, allowlist membership and caps, or Business Platform opt-in and 24-hour window state."
      intent_examples: ["is WhatsApp connected"]
      input_schema_ref: "schema://nova/prepare-a-whatsapp-message/channel-query@0.1.0"
      output_schema_ref: "schema://nova/prepare-a-whatsapp-message/channel-state@0.1.0"
      risk_class: "high"
      preconditions: ["channel installation bound to the user"]
      postconditions: ["state recorded with checked_at"]
      tools:
        - tool_id: "nova.comms.whatsapp.channel.status"
          name: "Channel status"
          description: "Return connected, connecting, logged_out, not_installed or unknown per variant, plus allowlist membership and daily count for linked-device."
          invocation: {protocol: "internal", binding_ref: "binding://nova/comms/whatsapp-status", operation: "status"}
          input_schema_ref: "schema://nova/prepare-a-whatsapp-message/channel-query@0.1.0"
          output_schema_ref: "schema://nova/prepare-a-whatsapp-message/channel-state@0.1.0"
          objects:
            - {object_id: "nova.comms.whatsapp_channel_state", name: "Channel state", description: "Readiness of one send variant", operations: ["read"], scope_rules: ["requesting user's installation only", "never exposes session credentials or pairing codes"], schema_ref: "schema://nova/prepare-a-whatsapp-message/channel-state@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/prepare-a-whatsapp-message/channel-query@0.1.0", output_schema_ref: "schema://nova/prepare-a-whatsapp-message/channel-state@0.1.0", constraints: ["read-only", "re-checked at send time"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["whatsapp:channel:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 10, max_attempts: 2, rate_limits: [], error_codes: ["logged_out", "not_installed"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["logged_out session never reported as connected"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}
        - tool_id: "nova.comms.whatsapp.channel.window"
          name: "Business window check"
          description: "Return opt-in status and whether the 24-hour customer service window is open. Not built."
          invocation: {protocol: "OpenAPI", binding_ref: "binding://nova/comms/whatsapp-window", operation: "window"}
          input_schema_ref: "schema://nova/prepare-a-whatsapp-message/channel-query@0.1.0"
          output_schema_ref: "schema://nova/prepare-a-whatsapp-message/channel-state@0.1.0"
          objects:
            - {object_id: "nova.comms.whatsapp_channel_state", name: "Channel state", description: "Opt-in and window state for one business conversation", operations: ["read"], scope_rules: ["requesting tenant's business number only"], schema_ref: "schema://nova/prepare-a-whatsapp-message/channel-state@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported; not built", compatible_environments: ["TBD"], input_schema_ref: "schema://nova/prepare-a-whatsapp-message/channel-query@0.1.0", output_schema_ref: "schema://nova/prepare-a-whatsapp-message/channel-state@0.1.0", constraints: ["read-only"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["whatsapp:channel:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 10, max_attempts: 2, rate_limits: [], error_codes: ["no_opt_in", "window_closed"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["window_open false when last inbound is older than 24 hours"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.comms.whatsapp.compose"
      name: "WhatsApp compose"
      description: "Draft free-form text, or fill an approved template, and check the result."
      intent_examples: ["WhatsApp Jane that lunch is on"]
      input_schema_ref: "schema://nova/prepare-a-whatsapp-message/request@0.1.0"
      output_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-draft@0.1.0"
      risk_class: "low"
      preconditions: ["variant selected"]
      postconditions: ["checked draft with a content hash"]
      tools:
        - tool_id: "nova.comms.whatsapp.compose.draft"
          name: "Draft message"
          description: "Free-form text from the user's intent only."
          invocation: {protocol: "internal", binding_ref: "binding://nova/comms/whatsapp-compose", operation: "draft"}
          input_schema_ref: "schema://nova/prepare-a-whatsapp-message/request@0.1.0"
          output_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-draft@0.1.0"
          objects:
            - {object_id: "nova.comms.whatsapp_draft", name: "Message draft", description: "Text or template with parameters", operations: ["create", "update"], scope_rules: ["this run only", "updates before approval only"], schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-draft@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/prepare-a-whatsapp-message/request@0.1.0", output_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-draft@0.1.0", constraints: ["no added facts, links or promises"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["contacts:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 30, max_attempts: 2, rate_limits: [], error_codes: ["draft_failed"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["every fact in the draft appears in the intent"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}
        - tool_id: "nova.comms.whatsapp.compose.fill_template"
          name: "Fill approved template"
          description: "Select a pre-approved template and fill its parameters from the intent; business variant outside the window. Not built."
          invocation: {protocol: "OpenAPI", binding_ref: "binding://nova/comms/whatsapp-template", operation: "fill_template"}
          input_schema_ref: "schema://nova/prepare-a-whatsapp-message/request@0.1.0"
          output_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-draft@0.1.0"
          objects:
            - {object_id: "nova.comms.whatsapp_draft", name: "Message draft", description: "Template name, language and parameters", operations: ["create"], scope_rules: ["approved templates of the tenant's business number only"], schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-draft@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported; not built", compatible_environments: ["TBD"], input_schema_ref: "schema://nova/prepare-a-whatsapp-message/request@0.1.0", output_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-draft@0.1.0", constraints: ["approved templates only", "parameters from the intent only"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["whatsapp:send:business"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 30, max_attempts: 2, rate_limits: [], error_codes: ["no_template", "template_not_approved"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["template status approved"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}
        - tool_id: "nova.comms.whatsapp.compose.check"
          name: "Check draft"
          description: "Length (max 4,096), forbidden content (secrets, codes, full account numbers) and added-fact checks."
          invocation: {protocol: "internal", binding_ref: "binding://nova/comms/whatsapp-check", operation: "check"}
          input_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-draft@0.1.0"
          output_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-draft@0.1.0"
          objects:
            - {object_id: "nova.comms.whatsapp_draft", name: "Message draft", description: "Text or template with parameters", operations: ["read"], scope_rules: ["this run only"], schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-draft@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-draft@0.1.0", output_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-draft@0.1.0", constraints: ["rules independent of drafting"], fallback_variant_id: null}
          authorization: {required: false, identity_provider: "TBD", required_scopes: [], consent_required: false, grant_ref: null, tenant_binding_required: false}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 5, max_attempts: 1, rate_limits: [], error_codes: ["too_long", "forbidden_content", "added_fact"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["forbidden-content fixtures always flagged"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.comms.whatsapp.send"
      name: "WhatsApp send"
      description: "Deliver one approved message through the variant its purpose allows, or hand it to the user."
      intent_examples: ["send it", "I'll send it myself"]
      input_schema_ref: "schema://nova/prepare-a-whatsapp-message/send-input@0.1.0"
      output_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-record@0.1.0"
      risk_class: "high"
      preconditions: ["approval for this content hash, recipient and variant"]
      postconditions: ["sent content hash equals approved hash"]
      tools:
        - tool_id: "nova.comms.whatsapp.send.message"
          name: "Send or hand off message"
          description: "Linked-device for personal messages, Business Platform for customer-facing messages, or hand-off to the user."
          invocation: {protocol: "internal", binding_ref: "binding://nova/comms/whatsapp-linked", operation: "send"}
          input_schema_ref: "schema://nova/prepare-a-whatsapp-message/send-input@0.1.0"
          output_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-record@0.1.0"
          objects:
            - {object_id: "nova.comms.whatsapp_record", name: "Outbound message", description: "One outbound WhatsApp message and its state", operations: ["create"], scope_rules: ["requesting user's tenant only", "one-to-one only"], schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-record@0.1.0"}
          variants:
            - {variant_id: "linked-device", description: "User's own account via a paired linked-device bridge; personal one-to-one messages only; binding binding://nova/comms/whatsapp-linked", compatible_environments: ["TBD"], input_schema_ref: "schema://nova/prepare-a-whatsapp-message/send-input@0.1.0", output_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-record@0.1.0", constraints: ["session connected", "recipient allowlisted", "daily cap", "never for business purpose", "no automated re-pairing"], fallback_variant_id: null}
            - {variant_id: "business-api", description: "WhatsApp Business Platform (Cloud API); required for customer-facing messages; binding binding://nova/comms/whatsapp-business; not built", compatible_environments: ["TBD"], input_schema_ref: "schema://nova/prepare-a-whatsapp-message/send-input@0.1.0", output_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-record@0.1.0", constraints: ["opt-in required", "free-form only inside the 24-hour window", "approved template outside the window", "platform messaging limits"], fallback_variant_id: null}
            - {variant_id: "handoff", description: "Human-assisted: approved text and click-to-chat link to the user; binding binding://nova/comms/whatsapp-handoff", compatible_environments: ["any"], input_schema_ref: "schema://nova/prepare-a-whatsapp-message/send-input@0.1.0", output_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-record@0.1.0", constraints: ["never reported as delivered"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["whatsapp:send:personal", "whatsapp:send:business"], consent_required: true, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["recipient receives a message under the user's or business's identity", "Business Platform charges where applicable", "hand-off message to the user"], idempotency: "required", timeout_seconds: 20, max_attempts: 1, rate_limits: ["linked-device: 1 per recipient per 10 minutes, 20 per day (TBD)", "Business Platform messaging limits"], error_codes: ["session_logged_out", "not_allowlisted", "no_opt_in", "window_closed", "send_failed"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["to and content hash equal approved values", "purpose business never sent via linked-device"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.comms.whatsapp.status"
      name: "WhatsApp delivery status"
      description: "Delivery state from receipts."
      intent_examples: ["did Jane get my WhatsApp"]
      input_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-ref@0.1.0"
      output_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-record@0.1.0"
      risk_class: "low"
      preconditions: ["an agent send happened"]
      postconditions: ["delivered or read only from receipts"]
      tools:
        - tool_id: "nova.comms.whatsapp.status.get"
          name: "Get message status"
          description: "Return accepted, sent, delivered, read or failed."
          invocation: {protocol: "internal", binding_ref: "binding://nova/comms/whatsapp-receipts", operation: "get"}
          input_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-ref@0.1.0"
          output_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-record@0.1.0"
          objects:
            - {object_id: "nova.comms.whatsapp_record", name: "Outbound message", description: "One outbound WhatsApp message and its state", operations: ["read"], scope_rules: ["requesting user's tenant only"], schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-record@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-ref@0.1.0", output_schema_ref: "schema://nova/prepare-a-whatsapp-message/wa-record@0.1.0", constraints: ["read-only"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["whatsapp:status:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 10, max_attempts: 3, rate_limits: [], error_codes: ["not_found"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["accepted and sent never reported as delivered"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.notify.owner"
      name: "Owner notification"
      description: "Deliver a message to the requesting user's own channel."
      intent_examples: []
      input_schema_ref: "schema://nova/prepare-a-whatsapp-message/whatsapp-result@0.1.0"
      output_schema_ref: "schema://nova/prepare-a-whatsapp-message/delivery@0.1.0"
      risk_class: "low"
      preconditions: ["owner channel configured"]
      postconditions: ["delivery receipt"]
      tools:
        - tool_id: "nova.notify.owner.send"
          name: "Notify owner"
          description: "Show the draft, collect approval and report the result to the requesting user only."
          invocation: {protocol: "internal", binding_ref: "binding://nova/notify/owner", operation: "send"}
          input_schema_ref: "schema://nova/prepare-a-whatsapp-message/whatsapp-result@0.1.0"
          output_schema_ref: "schema://nova/prepare-a-whatsapp-message/delivery@0.1.0"
          objects:
            - {object_id: "nova.notify.message", name: "Owner message", description: "A message to the requesting user", operations: ["create"], scope_rules: ["owner channel only"], schema_ref: "schema://nova/prepare-a-whatsapp-message/delivery@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/prepare-a-whatsapp-message/whatsapp-result@0.1.0", output_schema_ref: "schema://nova/prepare-a-whatsapp-message/delivery@0.1.0", constraints: ["owner only", "numbers masked to the last 4 digits", "never includes pairing codes"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["notify:owner"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["message delivered to the user"], idempotency: "required", timeout_seconds: 15, max_attempts: 3, rate_limits: [], error_codes: ["channel_unavailable"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["delivery receipt received"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

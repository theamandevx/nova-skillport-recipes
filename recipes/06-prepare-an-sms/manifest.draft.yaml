# DRAFT — conceptual authoring shape from Skill Port Recipe Standard v1 §2.6; pending validation against Skill Port's approved JSON Schema.
manifest:
  package:
    app_id: "nova.comms"
    name: "Nova — Calls and messages"
    version: "0.1.0"
    owner: "TBD (publisher ID assigned at Skill Port verification)"
    status: "draft"
    description: "Draft, measure, check and approve one SMS; hand it to the user to send, or send through a provider when one is installed (provider path not built)."
    compatibility:
      recipe_contract: "1.x"
      runtimes: ["TBD"]
      protocols: ["internal", "OpenAPI"]
    installation:
      mode: "user"
      prerequisites:
        - "LLM for drafting"
        - "Contact directory and an owner notification channel"
        - "Provider variant only: SMS provider account with a sender registered per destination country, opt-out register and inbound-reply handler (none built)"
      health_check_ref: null

  capabilities:
    - capability_id: "nova.contacts.directory"
      name: "Contact directory"
      description: "Find a person's phone number from approved sources."
      intent_examples: ["text Jane", "what's Jane's number"]
      input_schema_ref: "schema://nova/prepare-an-sms/contact-query@0.1.0"
      output_schema_ref: "schema://nova/prepare-an-sms/contact@0.1.0"
      risk_class: "medium"
      preconditions: ["requesting user identified"]
      postconditions: ["exactly one contact returned, or none"]
      tools:
        - tool_id: "nova.contacts.directory.lookup"
          name: "Look up contact"
          description: "Search assistant memory, then the contact directory, then ask the user once."
          invocation: {protocol: "internal", binding_ref: "binding://nova/contacts/lookup", operation: "lookup"}
          input_schema_ref: "schema://nova/prepare-an-sms/contact-query@0.1.0"
          output_schema_ref: "schema://nova/prepare-an-sms/contact@0.1.0"
          objects:
            - {object_id: "nova.contacts.contact", name: "Contact", description: "A person and phone number owned by the user", operations: ["read"], scope_rules: ["requesting user's contacts only"], schema_ref: "schema://nova/prepare-an-sms/contact@0.1.0"}
          variants:
            - {variant_id: "memory", description: "Assistant memory (read-only), tried first", compatible_environments: [], input_schema_ref: "schema://nova/prepare-an-sms/contact-query@0.1.0", output_schema_ref: "schema://nova/prepare-an-sms/contact@0.1.0", constraints: ["read-only"], fallback_variant_id: "directory"}
            - {variant_id: "directory", description: "Contact directory (read-only), tried second", compatible_environments: [], input_schema_ref: "schema://nova/prepare-an-sms/contact-query@0.1.0", output_schema_ref: "schema://nova/prepare-an-sms/contact@0.1.0", constraints: ["read-only"], fallback_variant_id: "ask-user"}
            - {variant_id: "ask-user", description: "Human-assisted: ask the user once; never guess", compatible_environments: [], input_schema_ref: "schema://nova/prepare-an-sms/contact-query@0.1.0", output_schema_ref: "schema://nova/prepare-an-sms/contact@0.1.0", constraints: ["one question only"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["contacts:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 10, max_attempts: 3, rate_limits: [], error_codes: ["not_found", "ambiguous", "invalid_number"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["phone_e164 is a valid E.164 number", "exactly one match"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.comms.sms.compose"
      name: "SMS compose"
      description: "Draft one SMS from the user's intent and measure its encoding and segments."
      intent_examples: ["text Jane that I'm running late"]
      input_schema_ref: "schema://nova/prepare-an-sms/request@0.1.0"
      output_schema_ref: "schema://nova/prepare-an-sms/sms-draft@0.1.0"
      risk_class: "low"
      preconditions: ["recipient resolved"]
      postconditions: ["segments within max_segments", "no forbidden content"]
      tools:
        - tool_id: "nova.comms.sms.compose.draft"
          name: "Draft SMS"
          description: "Write the message from the user's intent only; identify the sender on provider sends."
          invocation: {protocol: "internal", binding_ref: "binding://nova/comms/sms-compose", operation: "draft"}
          input_schema_ref: "schema://nova/prepare-an-sms/request@0.1.0"
          output_schema_ref: "schema://nova/prepare-an-sms/sms-draft@0.1.0"
          objects:
            - {object_id: "nova.comms.sms_draft", name: "SMS draft", description: "Text, encoding, character and segment counts", operations: ["create", "update"], scope_rules: ["this run only", "updates before approval only"], schema_ref: "schema://nova/prepare-an-sms/sms-draft@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/prepare-an-sms/request@0.1.0", output_schema_ref: "schema://nova/prepare-an-sms/sms-draft@0.1.0", constraints: ["no added facts or links"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["contacts:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 30, max_attempts: 2, rate_limits: [], error_codes: ["draft_failed"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["every fact in the draft appears in the intent"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}
        - tool_id: "nova.comms.sms.compose.measure"
          name: "Measure SMS"
          description: "GSM-7 (160 single / 153 split; extension characters count twice) or UCS-2 (70 single / 67 split)."
          invocation: {protocol: "internal", binding_ref: "binding://nova/comms/sms-measure", operation: "measure"}
          input_schema_ref: "schema://nova/prepare-an-sms/sms-draft@0.1.0"
          output_schema_ref: "schema://nova/prepare-an-sms/sms-draft@0.1.0"
          objects:
            - {object_id: "nova.comms.sms_draft", name: "SMS draft", description: "Text, encoding, character and segment counts", operations: ["read"], scope_rules: ["this run only"], schema_ref: "schema://nova/prepare-an-sms/sms-draft@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/prepare-an-sms/sms-draft@0.1.0", output_schema_ref: "schema://nova/prepare-an-sms/sms-draft@0.1.0", constraints: ["deterministic"], fallback_variant_id: null}
          authorization: {required: false, identity_provider: "TBD", required_scopes: [], consent_required: false, grant_ref: null, tenant_binding_required: false}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 5, max_attempts: 1, rate_limits: [], error_codes: []}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["segment counts match reference fixtures"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.comms.sms.policy"
      name: "SMS policy"
      description: "Decide whether this SMS may go out now, to this number, by which mode."
      intent_examples: []
      input_schema_ref: "schema://nova/prepare-an-sms/policy-input@0.1.0"
      output_schema_ref: "schema://nova/prepare-an-sms/policy-result@0.1.0"
      risk_class: "high"
      preconditions: ["recipient resolved with country and time zone"]
      postconditions: ["every hard check recorded with a reason"]
      tools:
        - tool_id: "nova.comms.sms.policy.check"
          name: "Check SMS policy"
          description: "Country allowlist, sender registration for the destination, quiet hours, content category, caps and provider eligibility."
          invocation: {protocol: "internal", binding_ref: "binding://nova/comms/sms-policy", operation: "check"}
          input_schema_ref: "schema://nova/prepare-an-sms/policy-input@0.1.0"
          output_schema_ref: "schema://nova/prepare-an-sms/policy-result@0.1.0"
          objects:
            - {object_id: "nova.comms.sms_policy_result", name: "Policy result", description: "Pass, fail or not_applicable per check", operations: ["create"], scope_rules: ["this run only"], schema_ref: "schema://nova/prepare-an-sms/policy-result@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/prepare-an-sms/policy-input@0.1.0", output_schema_ref: "schema://nova/prepare-an-sms/policy-result@0.1.0", constraints: ["stricter local rules win"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["sms:optout:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 10, max_attempts: 2, rate_limits: [], error_codes: ["not_allowlisted", "quiet_hours", "sender_not_registered", "cap_reached", "marketing_content"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["re-run at send time"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.comms.sms.optout"
      name: "SMS opt-out register"
      description: "Numbers that opted out of messages from a sender; required before the provider variant can activate. Not built."
      intent_examples: []
      input_schema_ref: "schema://nova/prepare-an-sms/optout-query@0.1.0"
      output_schema_ref: "schema://nova/prepare-an-sms/optout-record@0.1.0"
      risk_class: "high"
      preconditions: ["register installed"]
      postconditions: ["opted-out numbers never messaged by the provider variant"]
      tools:
        - tool_id: "nova.comms.sms.optout.lookup"
          name: "Look up opt-out"
          description: "Return whether a number opted out for this sender."
          invocation: {protocol: "internal", binding_ref: "binding://nova/comms/sms-optout-lookup", operation: "lookup"}
          input_schema_ref: "schema://nova/prepare-an-sms/optout-query@0.1.0"
          output_schema_ref: "schema://nova/prepare-an-sms/optout-record@0.1.0"
          objects:
            - {object_id: "nova.comms.optout_record", name: "Opt-out record", description: "A number that opted out, with keyword and time", operations: ["read"], scope_rules: ["per sender and tenant"], schema_ref: "schema://nova/prepare-an-sms/optout-record@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported; not built", compatible_environments: ["TBD"], input_schema_ref: "schema://nova/prepare-an-sms/optout-query@0.1.0", output_schema_ref: "schema://nova/prepare-an-sms/optout-record@0.1.0", constraints: ["read-only"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["sms:optout:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 10, max_attempts: 3, rate_limits: [], error_codes: ["register_unavailable"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["opted-out fixture returns opted_out true"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}
        - tool_id: "nova.comms.sms.optout.record"
          name: "Record opt-out"
          description: "Record STOP and similar replies; used by the inbound-reply handler, not by this run. Not built."
          invocation: {protocol: "internal", binding_ref: "binding://nova/comms/sms-optout-record", operation: "record"}
          input_schema_ref: "schema://nova/prepare-an-sms/optout-record@0.1.0"
          output_schema_ref: "schema://nova/prepare-an-sms/optout-record@0.1.0"
          objects:
            - {object_id: "nova.comms.optout_record", name: "Opt-out record", description: "A number that opted out, with keyword and time", operations: ["create"], scope_rules: ["per sender and tenant", "never removed by the agent"], schema_ref: "schema://nova/prepare-an-sms/optout-record@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported; not built", compatible_environments: ["TBD"], input_schema_ref: "schema://nova/prepare-an-sms/optout-record@0.1.0", output_schema_ref: "schema://nova/prepare-an-sms/optout-record@0.1.0", constraints: ["opt-out keywords per jurisdiction TBD"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["sms:optout:write"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["opt-out recorded"], idempotency: "required", timeout_seconds: 10, max_attempts: 3, rate_limits: [], error_codes: ["register_unavailable"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["lookup returns opted_out true after record"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.comms.sms.send"
      name: "SMS send"
      description: "Deliver one approved SMS: hand it to the user (default) or send through a provider (not built)."
      intent_examples: ["send it", "I'll send it myself"]
      input_schema_ref: "schema://nova/prepare-an-sms/send-input@0.1.0"
      output_schema_ref: "schema://nova/prepare-an-sms/sms-record@0.1.0"
      risk_class: "high"
      preconditions: ["approval for this text hash, recipient and mode"]
      postconditions: ["delivered text hash equals approved hash"]
      tools:
        - tool_id: "nova.comms.sms.send.message"
          name: "Send or hand off SMS"
          description: "Hand-off returns the approved text and an sms: link to the user; provider-api submits one message."
          invocation: {protocol: "internal", binding_ref: "binding://nova/comms/sms-handoff", operation: "send"}
          input_schema_ref: "schema://nova/prepare-an-sms/send-input@0.1.0"
          output_schema_ref: "schema://nova/prepare-an-sms/sms-record@0.1.0"
          objects:
            - {object_id: "nova.comms.sms_record", name: "Outbound SMS", description: "One outbound message and its delivery state", operations: ["create"], scope_rules: ["requesting user's tenant only", "provider variant only"], schema_ref: "schema://nova/prepare-an-sms/sms-record@0.1.0"}
          variants:
            - {variant_id: "handoff", description: "Default; human-assisted: the user sends from their own phone; delivery cannot be confirmed", compatible_environments: ["any"], input_schema_ref: "schema://nova/prepare-an-sms/send-input@0.1.0", output_schema_ref: "schema://nova/prepare-an-sms/sms-record@0.1.0", constraints: ["never reported as delivered"], fallback_variant_id: null}
            - {variant_id: "provider-api", description: "SMS provider REST API with a registered sender; binding binding://nova/comms/sms-provider; not built", compatible_environments: ["TBD"], input_schema_ref: "schema://nova/prepare-an-sms/send-input@0.1.0", output_schema_ref: "schema://nova/prepare-an-sms/sms-record@0.1.0", constraints: ["opt-out register and inbound handler installed", "registered sender for the country", "quiet hours", "one message per approval", "no automatic re-send", "never a silent fallback to or from handoff"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["sms:send"], consent_required: true, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["recipient receives an SMS (provider)", "provider charges (provider)", "hand-off message to the user (handoff)"], idempotency: "required", timeout_seconds: 20, max_attempts: 1, rate_limits: ["1 per recipient per 10 minutes", "20 per user per day (TBD)"], error_codes: ["provider_rejected", "opted_out", "quiet_hours", "sender_not_registered", "over_budget"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["to and text hash equal approved values"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.comms.sms.status"
      name: "SMS delivery status"
      description: "Delivery state of a provider-sent SMS from provider receipts. Not built."
      intent_examples: ["did Jane get my text"]
      input_schema_ref: "schema://nova/prepare-an-sms/sms-ref@0.1.0"
      output_schema_ref: "schema://nova/prepare-an-sms/sms-record@0.1.0"
      risk_class: "low"
      preconditions: ["provider variant used"]
      postconditions: ["delivered only from a receipt"]
      tools:
        - tool_id: "nova.comms.sms.status.get"
          name: "Get SMS status"
          description: "Return accepted, queued, sent, delivered, undelivered or failed."
          invocation: {protocol: "internal", binding_ref: "binding://nova/comms/sms-status", operation: "get"}
          input_schema_ref: "schema://nova/prepare-an-sms/sms-ref@0.1.0"
          output_schema_ref: "schema://nova/prepare-an-sms/sms-record@0.1.0"
          objects:
            - {object_id: "nova.comms.sms_record", name: "Outbound SMS", description: "One outbound message and its delivery state", operations: ["read"], scope_rules: ["requesting user's tenant only"], schema_ref: "schema://nova/prepare-an-sms/sms-record@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported; not built", compatible_environments: ["TBD"], input_schema_ref: "schema://nova/prepare-an-sms/sms-ref@0.1.0", output_schema_ref: "schema://nova/prepare-an-sms/sms-record@0.1.0", constraints: ["read-only"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["sms:status:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 10, max_attempts: 3, rate_limits: [], error_codes: ["not_found"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["accepted, queued and sent never reported as delivered"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.notify.owner"
      name: "Owner notification"
      description: "Deliver a message to the requesting user's own channel."
      intent_examples: []
      input_schema_ref: "schema://nova/prepare-an-sms/sms-result@0.1.0"
      output_schema_ref: "schema://nova/prepare-an-sms/delivery@0.1.0"
      risk_class: "low"
      preconditions: ["owner channel configured"]
      postconditions: ["delivery receipt"]
      tools:
        - tool_id: "nova.notify.owner.send"
          name: "Notify owner"
          description: "Show the draft, collect approval and report the result to the requesting user only."
          invocation: {protocol: "internal", binding_ref: "binding://nova/notify/owner", operation: "send"}
          input_schema_ref: "schema://nova/prepare-an-sms/sms-result@0.1.0"
          output_schema_ref: "schema://nova/prepare-an-sms/delivery@0.1.0"
          objects:
            - {object_id: "nova.notify.message", name: "Owner message", description: "A message to the requesting user", operations: ["create"], scope_rules: ["owner channel only"], schema_ref: "schema://nova/prepare-an-sms/delivery@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/prepare-an-sms/sms-result@0.1.0", output_schema_ref: "schema://nova/prepare-an-sms/delivery@0.1.0", constraints: ["owner only", "numbers masked to the last 4 digits"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["notify:owner"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["message delivered to the user"], idempotency: "required", timeout_seconds: 15, max_attempts: 3, rate_limits: [], error_codes: ["channel_unavailable"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["delivery receipt received"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

# DRAFT — conceptual authoring shape from Skill Port Recipe Standard v1 §2.6; pending validation against Skill Port's approved JSON Schema.
manifest:
  package:
    app_id: "nova.calendar"
    name: "Nova — Calendar and meetings"
    version: "0.1.0"
    owner: "TBD (publisher ID assigned at Skill Port verification)"
    status: "draft"
    description: "Record a meeting on the user's own computer only after an explicit Record press, then transcribe it and produce grounded minutes."
    compatibility:
      recipe_contract: "1.x"
      runtimes: ["TBD"]
      protocols: ["internal", "MCP"]
    installation:
      mode: "user"
      prerequisites:
        - "Signed desktop app build on an OS with an app-audio capture API (reference: macOS 14.4 or later)"
        - "Device paired to the user's account with a 6-digit confirm code"
        - "Microphone and system-audio permission granted by the user"
        - "Whisper-class speech-to-text provider behind the relay; LLM for minutes; owner notification channel"
      health_check_ref: null

  capabilities:
    - capability_id: "nova.desktop.pairing"
      name: "Device pairing"
      description: "Bind one desktop device to the user's account with a revocable, allowlist-limited device token."
      intent_examples: ["pair this computer", "revoke my laptop"]
      input_schema_ref: "schema://nova/desktop-meeting-recorder/pairing@0.1.0"
      output_schema_ref: "schema://nova/desktop-meeting-recorder/pairing@0.1.0"
      risk_class: "medium"
      preconditions: ["user signed in to the portal"]
      postconditions: ["pairing confirmed or revoked"]
      tools:
        - tool_id: "nova.desktop.pairing.pair"
          name: "Pair device"
          description: "Device shows a 6-digit code; the user confirms it in the portal; a device token is issued to the device keychain."
          invocation: {protocol: "internal", binding_ref: "binding://nova/desktop/pair", operation: "pair"}
          input_schema_ref: "schema://nova/desktop-meeting-recorder/pairing@0.1.0"
          output_schema_ref: "schema://nova/desktop-meeting-recorder/pairing@0.1.0"
          objects:
            - {object_id: "nova.desktop.device_pairing", name: "Device pairing", description: "A device bound to the user; token stored as secret_ref://device-token", operations: ["create"], scope_rules: ["requesting user's account only", "code expires if not confirmed"], schema_ref: "schema://nova/desktop-meeting-recorder/pairing@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/desktop-meeting-recorder/pairing@0.1.0", output_schema_ref: "schema://nova/desktop-meeting-recorder/pairing@0.1.0", constraints: ["user confirms the code while signed in"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["device:pair"], consent_required: true, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["device token issued"], idempotency: "required", timeout_seconds: 300, max_attempts: 1, rate_limits: ["5 pairing attempts per hour"], error_codes: ["code_expired", "code_mismatch"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["pairing status confirmed", "token accepted only for allowlisted actions"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}
        - tool_id: "nova.desktop.pairing.revoke"
          name: "Revoke device"
          description: "Kill switch: revoke the device token immediately."
          invocation: {protocol: "internal", binding_ref: "binding://nova/desktop/revoke", operation: "revoke"}
          input_schema_ref: "schema://nova/desktop-meeting-recorder/pairing@0.1.0"
          output_schema_ref: "schema://nova/desktop-meeting-recorder/pairing@0.1.0"
          objects:
            - {object_id: "nova.desktop.device_pairing", name: "Device pairing", description: "A device bound to the user", operations: ["update"], scope_rules: ["revoked_at only"], schema_ref: "schema://nova/desktop-meeting-recorder/pairing@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/desktop-meeting-recorder/pairing@0.1.0", output_schema_ref: "schema://nova/desktop-meeting-recorder/pairing@0.1.0", constraints: [], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["device:revoke"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["device token stops working"], idempotency: "required", timeout_seconds: 10, max_attempts: 3, rate_limits: [], error_codes: ["not_found"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["next relay call returns 401"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.desktop.recorder"
      name: "Desktop recorder"
      description: "Local two-track capture on the user's own computer, started only by an explicit Record press behind visible indicators."
      intent_examples: ["(user presses Record in the app)"]
      input_schema_ref: "schema://nova/desktop-meeting-recorder/request@0.1.0"
      output_schema_ref: "schema://nova/desktop-meeting-recorder/recording-session@0.1.0"
      risk_class: "high"
      preconditions: ["explicit Record press in the focused app UI", "consent reminder confirmed (default on)", "press not older than 5 s and not spanning a sleep"]
      postconditions: ["session ended with an end_reason", "indicator off after stop", "never resumed after sleep"]
      tools:
        - tool_id: "nova.desktop.recorder.start"
          name: "Start recording"
          description: "Begin capture after a Record press; show the menu-bar indicator; the OS indicator is never suppressed. No API, schedule, remote or auto start exists."
          invocation: {protocol: "other", binding_ref: "binding://nova/desktop/recorder-start", operation: "start"}
          input_schema_ref: "schema://nova/desktop-meeting-recorder/request@0.1.0"
          output_schema_ref: "schema://nova/desktop-meeting-recorder/recording-session@0.1.0"
          objects:
            - {object_id: "nova.desktop.recording_session", name: "Recording session", description: "One local recording", operations: ["create"], scope_rules: ["user's own device only", "one active recording per device"], schema_ref: "schema://nova/desktop-meeting-recorder/recording-session@0.1.0"}
            - {object_id: "nova.desktop.audio_chunk", name: "Audio chunk", description: "A finalised piece of one track in the local spool", operations: ["create"], scope_rules: ["local spool only", "deleted after ingest or retention (default 7 days)"], schema_ref: "schema://nova/desktop-meeting-recorder/chunk@0.1.0"}
          variants:
            - {variant_id: "two-track", description: "Default: microphone (the user) and system audio (others) on separate tracks with start offsets", compatible_environments: ["macOS 14.4+ (reference)", "TBD"], input_schema_ref: "schema://nova/desktop-meeting-recorder/request@0.1.0", output_schema_ref: "schema://nova/desktop-meeting-recorder/recording-session@0.1.0", constraints: ["system-audio permission granted", "signed build"], fallback_variant_id: null}
            - {variant_id: "mic-only", description: "Microphone only; selected only by explicit user choice, never as a silent fallback", compatible_environments: ["TBD"], input_schema_ref: "schema://nova/desktop-meeting-recorder/request@0.1.0", output_schema_ref: "schema://nova/desktop-meeting-recorder/recording-session@0.1.0", constraints: ["explicit user choice"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "OS permission prompts (microphone, system audio)", required_scopes: ["os:microphone", "os:system-audio"], consent_required: true, grant_ref: null, tenant_binding_required: false}
          execution: {side_effects: ["microphone and system audio captured locally", "recording indicators on"], idempotency: "required", timeout_seconds: 5, max_attempts: 1, rate_limits: ["1 active recording per device"], error_codes: ["stale_press", "non_press_source", "consent_missing", "permission_missing", "capture_error"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["press source is ui_button or ui_shortcut", "indicator_shown true", "non-zero level on at least one track within 10 s"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}
        - tool_id: "nova.desktop.recorder.stop"
          name: "Stop recording"
          description: "Finalise the current chunk and end capture on Stop, cap, system sleep (ended_by_sleep, never auto-resumed), permission loss, app quit or error."
          invocation: {protocol: "other", binding_ref: "binding://nova/desktop/recorder-stop", operation: "stop"}
          input_schema_ref: "schema://nova/desktop-meeting-recorder/recording-session@0.1.0"
          output_schema_ref: "schema://nova/desktop-meeting-recorder/recording-session@0.1.0"
          objects:
            - {object_id: "nova.desktop.recording_session", name: "Recording session", description: "One local recording", operations: ["update"], scope_rules: ["ended_at and end_reason only"], schema_ref: "schema://nova/desktop-meeting-recorder/recording-session@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/desktop-meeting-recorder/recording-session@0.1.0", output_schema_ref: "schema://nova/desktop-meeting-recorder/recording-session@0.1.0", constraints: ["no auto-resume"], fallback_variant_id: null}
          authorization: {required: false, identity_provider: "TBD", required_scopes: [], consent_required: false, grant_ref: null, tenant_binding_required: false}
          execution: {side_effects: ["capture ends", "indicators off"], idempotency: "required", timeout_seconds: 3, max_attempts: 1, rate_limits: [], error_codes: ["finalise_failed"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["no capture after stop", "last chunk finalised and hashed"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}
        - tool_id: "nova.desktop.recorder.status"
          name: "Recorder status"
          description: "Return state, elapsed time, indicator state, per-track level and readiness."
          invocation: {protocol: "other", binding_ref: "binding://nova/desktop/recorder-status", operation: "status"}
          input_schema_ref: "schema://nova/desktop-meeting-recorder/recording-session@0.1.0"
          output_schema_ref: "schema://nova/desktop-meeting-recorder/recording-session@0.1.0"
          objects:
            - {object_id: "nova.desktop.recording_session", name: "Recording session", description: "One local recording", operations: ["read"], scope_rules: ["user's own device only"], schema_ref: "schema://nova/desktop-meeting-recorder/recording-session@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/desktop-meeting-recorder/recording-session@0.1.0", output_schema_ref: "schema://nova/desktop-meeting-recorder/recording-session@0.1.0", constraints: ["read-only"], fallback_variant_id: null}
          authorization: {required: false, identity_provider: "TBD", required_scopes: [], consent_required: false, grant_ref: null, tenant_binding_required: false}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 5, max_attempts: 2, rate_limits: [], error_codes: []}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["indicator state matches capture state"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.desktop.stt_relay"
      name: "Speech-to-text relay"
      description: "Relay one audio chunk to speech-to-text under the device token; the relay keeps no audio."
      intent_examples: []
      input_schema_ref: "schema://nova/desktop-meeting-recorder/chunk@0.1.0"
      output_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0"
      risk_class: "high"
      preconditions: ["device token valid", "chunk finalised"]
      postconditions: ["segments returned", "no audio stored server-side"]
      tools:
        - tool_id: "nova.desktop.stt_relay.transcribe_chunk"
          name: "Transcribe chunk"
          description: "Send one chunk through the authenticated relay to the hosted STT variant and return timed segments."
          invocation: {protocol: "internal", binding_ref: "binding://nova/desktop/stt-relay", operation: "transcribe_chunk"}
          input_schema_ref: "schema://nova/desktop-meeting-recorder/chunk@0.1.0"
          output_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0"
          objects:
            - {object_id: "nova.desktop.audio_chunk", name: "Audio chunk", description: "Relayed transiently, never persisted server-side", operations: ["read"], scope_rules: ["user's own recording only"], schema_ref: "schema://nova/desktop-meeting-recorder/chunk@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported; uses nova.transcribe.audio.transcribe.whisper-hosted", compatible_environments: [], input_schema_ref: "schema://nova/desktop-meeting-recorder/chunk@0.1.0", output_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0", constraints: ["device token allowlist", "audio discarded after response"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD (device token issued by pairing)", required_scopes: ["stt:relay"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["audio sent to the STT provider", "provider charges"], idempotency: "required", timeout_seconds: 60, max_attempts: 5, rate_limits: ["2 parallel uploads per device"], error_codes: ["401_revoked", "403_forbidden_for_device", "503_auth_unavailable", "provider_error"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["receipt per non-empty chunk", "segment times within chunk duration"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.transcribe.audio"
      name: "Transcription and speaker attribution"
      description: "Whisper-class speech-to-text and speaker attribution."
      intent_examples: []
      input_schema_ref: "schema://nova/desktop-meeting-recorder/chunk@0.1.0"
      output_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0"
      risk_class: "medium"
      preconditions: ["audio available to the selected variant"]
      postconditions: ["timed, labelled segments"]
      tools:
        - tool_id: "nova.transcribe.audio.transcribe"
          name: "Transcribe audio"
          description: "Whisper-class transcription."
          invocation: {protocol: "internal", binding_ref: "binding://nova/transcribe/stt", operation: "transcribe"}
          input_schema_ref: "schema://nova/desktop-meeting-recorder/chunk@0.1.0"
          output_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0"
          objects:
            - {object_id: "nova.transcribe.transcript_segment", name: "Transcript segment", description: "Timed text from one chunk", operations: ["create"], scope_rules: ["linked recording only"], schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0"}
          variants:
            - {variant_id: "whisper-hosted", description: "Selected: hosted Whisper-class model via the relay (about USD 0.08 per meeting hour in the reference)", compatible_environments: [], input_schema_ref: "schema://nova/desktop-meeting-recorder/chunk@0.1.0", output_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0", constraints: ["reached only through the relay"], fallback_variant_id: null}
            - {variant_id: "whisper-local", description: "Declared, not eligible in this version (on-device private mode deferred)", compatible_environments: ["TBD"], input_schema_ref: "schema://nova/desktop-meeting-recorder/chunk@0.1.0", output_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0", constraints: ["not eligible"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["stt:relay"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["provider charges"], idempotency: "recommended", timeout_seconds: 60, max_attempts: 3, rate_limits: ["provider limits"], error_codes: ["provider_error", "unsupported_language"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["non-empty text for non-silent audio"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}
        - tool_id: "nova.transcribe.audio.diarize"
          name: "Attribute speakers"
          description: "Label segments by speaker."
          invocation: {protocol: "internal", binding_ref: "binding://nova/transcribe/diarize", operation: "diarize"}
          input_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0"
          output_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0"
          objects:
            - {object_id: "nova.transcribe.transcript_segment", name: "Transcript segment", description: "Timed text with an ephemeral speaker label", operations: ["update"], scope_rules: ["speaker label only", "labels never become voiceprints"], schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0"}
          variants:
            - {variant_id: "channel-split", description: "Selected for two-track: mic = Me, system = Others, aligned by track offsets", compatible_environments: [], input_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0", output_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0", constraints: ["two-track recording"], fallback_variant_id: null}
            - {variant_id: "none", description: "Selected for mic-only: all segments labelled Room", compatible_environments: [], input_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0", output_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0", constraints: ["mic-only recording"], fallback_variant_id: null}
            - {variant_id: "local-model", description: "Not eligible here (needs audio on a server or a local model); declared for recipe 26", compatible_environments: ["TBD"], input_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0", output_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0", constraints: ["not eligible"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["minutes:ingest"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 30, max_attempts: 2, rate_limits: [], error_codes: ["offsets_missing"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["segments ordered by start_ms", "gaps listed"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.desktop.minutes_ingest"
      name: "Device transcript ingest"
      description: "Accept a finished device transcript into the minutes pipeline."
      intent_examples: []
      input_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0"
      output_schema_ref: "schema://nova/desktop-meeting-recorder/minutes@0.1.0"
      risk_class: "medium"
      preconditions: ["device token valid"]
      postconditions: ["one minutes session per recording"]
      tools:
        - tool_id: "nova.desktop.minutes_ingest.submit"
          name: "Submit transcript"
          description: "Post the merged transcript and metadata; returns a minutes session ID."
          invocation: {protocol: "internal", binding_ref: "binding://nova/desktop/minutes-ingest", operation: "submit"}
          input_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0"
          output_schema_ref: "schema://nova/desktop-meeting-recorder/minutes@0.1.0"
          objects:
            - {object_id: "nova.minutes.session", name: "Minutes session", description: "Minutes for one meeting", operations: ["create"], scope_rules: ["user's tenant only"], schema_ref: "schema://nova/desktop-meeting-recorder/minutes@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0", output_schema_ref: "schema://nova/desktop-meeting-recorder/minutes@0.1.0", constraints: ["transcript only, never audio"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD (device token issued by pairing)", required_scopes: ["minutes:ingest"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["minutes session created"], idempotency: "required", timeout_seconds: 30, max_attempts: 3, rate_limits: [], error_codes: ["401_revoked", "503_auth_unavailable", "duplicate"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["store.get returns the same segment count"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.minutes.extract"
      name: "Minutes extraction"
      description: "Turn a transcript into summary points, decisions and action items with owners and due dates."
      intent_examples: []
      input_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0"
      output_schema_ref: "schema://nova/desktop-meeting-recorder/minutes@0.1.0"
      risk_class: "low"
      preconditions: ["transcript stored"]
      postconditions: ["owners limited to Me, Others or named attendees", "due dates only when stated"]
      tools:
        - tool_id: "nova.minutes.extract.structured"
          name: "Extract structured minutes"
          description: "LLM extraction into the minutes schema."
          invocation: {protocol: "internal", binding_ref: "binding://nova/minutes/extract", operation: "structured"}
          input_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0"
          output_schema_ref: "schema://nova/desktop-meeting-recorder/minutes@0.1.0"
          objects:
            - {object_id: "nova.minutes.session", name: "Minutes session", description: "Draft minutes", operations: ["read"], scope_rules: ["user's tenant only"], schema_ref: "schema://nova/desktop-meeting-recorder/minutes@0.1.0"}
          variants:
            - {variant_id: "single-pass", description: "Transcripts within the model token limit (TBD)", compatible_environments: [], input_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0", output_schema_ref: "schema://nova/desktop-meeting-recorder/minutes@0.1.0", constraints: ["length within limit"], fallback_variant_id: null}
            - {variant_id: "chunked", description: "Longer transcripts: per-section extraction merged into the same schema", compatible_environments: [], input_schema_ref: "schema://nova/desktop-meeting-recorder/transcript-segment@0.1.0", output_schema_ref: "schema://nova/desktop-meeting-recorder/minutes@0.1.0", constraints: ["selected by length only"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["minutes:write"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["LLM charges"], idempotency: "recommended", timeout_seconds: 90, max_attempts: 2, rate_limits: [], error_codes: ["unparseable_output"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["output parses against minutes@0.1.0"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.minutes.verify"
      name: "Minutes grounding check"
      description: "Check every minutes item against the transcript, independently of extraction."
      intent_examples: []
      input_schema_ref: "schema://nova/desktop-meeting-recorder/minutes@0.1.0"
      output_schema_ref: "schema://nova/desktop-meeting-recorder/minutes@0.1.0"
      risk_class: "low"
      preconditions: ["draft minutes and transcript available"]
      postconditions: ["every item has source_refs or is removed / flagged low"]
      tools:
        - tool_id: "nova.minutes.verify.grounding"
          name: "Verify grounding"
          description: "Attach transcript references; remove unsupported items; flag weakly supported items as low confidence."
          invocation: {protocol: "internal", binding_ref: "binding://nova/minutes/verify", operation: "grounding"}
          input_schema_ref: "schema://nova/desktop-meeting-recorder/minutes@0.1.0"
          output_schema_ref: "schema://nova/desktop-meeting-recorder/minutes@0.1.0"
          objects:
            - {object_id: "nova.minutes.session", name: "Minutes session", description: "Draft minutes", operations: ["read"], scope_rules: ["user's tenant only"], schema_ref: "schema://nova/desktop-meeting-recorder/minutes@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/desktop-meeting-recorder/minutes@0.1.0", output_schema_ref: "schema://nova/desktop-meeting-recorder/minutes@0.1.0", constraints: ["separate pass from extraction"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["minutes:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["LLM charges"], idempotency: "not_applicable", timeout_seconds: 60, max_attempts: 2, rate_limits: [], error_codes: ["verifier_unavailable"]}

# DRAFT — conceptual authoring shape from Skill Port Recipe Standard v1 §2.6; pending validation against Skill Port's approved JSON Schema.
# Where a variant uses a different binding from its tool, it carries its own binding_ref (Standard §2.3 callable-object contract).
manifest:
  package:
    app_id: "nova.knowledge"
    name: "Nova — Knowledge and research"
    version: "0.1.0"
    owner: "TBD (publisher ID assigned at Skill Port verification)"
    status: "draft"
    description: "Scheduled morning brief of trending items with sources, delivered to the owner's chat, with a mandatory fallback model on a different provider and no silent failures."
    compatibility:
      recipe_contract: "1.x"
      runtimes: ["TBD"]
      protocols: ["internal"]
    installation:
      mode: "user"
      prerequisites:
        - "Owner-approved daily job AND an independent missed-run watcher job"
        - "Two model providers with separate accounts and credit balances (primary + fallback); activation refused otherwise"
        - "Owner chat channel; optional secondary alert channel"
        - "Topic source: nova.knowledge.trending-topics-radar or an equivalent topic store"
      health_check_ref: null

  capabilities:
    - capability_id: "nova.ops.providers"
      name: "Provider readiness"
      description: "Report whether a model provider binding can serve a call now."
      intent_examples: []
      input_schema_ref: "schema://nova/daily-ai-topic-brief/config@0.1.0"
      output_schema_ref: "schema://nova/daily-ai-topic-brief/provider-health@0.1.0"
      risk_class: "low"
      preconditions: ["provider references configured"]
      postconditions: ["reachable, auth_ok and credit_status recorded per provider"]
      tools:
        - tool_id: "nova.ops.providers.check"
          name: "Check provider"
          description: "Reachability, authentication and credit/quota status where the provider exposes it; unknown when it does not."
          invocation: {protocol: "internal", binding_ref: "binding://nova/ops/provider-check", operation: "check"}
          input_schema_ref: "schema://nova/daily-ai-topic-brief/config@0.1.0"
          output_schema_ref: "schema://nova/daily-ai-topic-brief/provider-health@0.1.0"
          objects:
            - {object_id: "nova.ops.provider_health", name: "Provider health", description: "Point-in-time readiness of one provider", operations: ["read"], scope_rules: ["owner's configured providers only"], schema_ref: "schema://nova/daily-ai-topic-brief/provider-health@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/daily-ai-topic-brief/config@0.1.0", output_schema_ref: "schema://nova/daily-ai-topic-brief/provider-health@0.1.0", constraints: ["read-only", "never logs keys"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["providers:health:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 20, max_attempts: 2, rate_limits: [], error_codes: ["unreachable", "auth_failed", "credit_exhausted", "credit_unknown"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["fallback provider and billing account differ from primary"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.topics.feed"
      name: "Topic feed refresh"
      description: "Run the trending-topics radar on demand when stored items are stale."
      intent_examples: ["refresh topics"]
      input_schema_ref: "schema://nova/trending-topics-radar/config@0.1.0"
      output_schema_ref: "schema://nova/trending-topics-radar/radar-result@0.1.0"
      risk_class: "low"
      preconditions: ["radar installed for the subject keys"]
      postconditions: ["radar result returned"]
      tools:
        - tool_id: "nova.topics.feed.refresh"
          name: "Refresh feed"
          description: "Trigger the radar recipe with trigger=on_demand."
          invocation: {protocol: "internal", binding_ref: "binding://nova/topics/refresh", operation: "refresh"}
          input_schema_ref: "schema://nova/trending-topics-radar/config@0.1.0"
          output_schema_ref: "schema://nova/trending-topics-radar/radar-result@0.1.0"
          objects:
            - {object_id: "nova.topics.topic", name: "Topic candidate", description: "Stored trending item", operations: ["create"], scope_rules: ["under the radar recipe's rules"], schema_ref: "schema://nova/trending-topics-radar/topic@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/trending-topics-radar/config@0.1.0", output_schema_ref: "schema://nova/trending-topics-radar/radar-result@0.1.0", constraints: ["one refresh per run"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["topics:refresh"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["topic rows may be created by the radar"], idempotency: "required", timeout_seconds: 300, max_attempts: 2, rate_limits: [], error_codes: ["radar_failed"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["radar_result status recorded"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.topics.store"
      name: "Topic store"
      description: "Read candidates and mark them sent or used."
      intent_examples: ["2"]
      input_schema_ref: "schema://nova/trending-topics-radar/topic@0.1.0"
      output_schema_ref: "schema://nova/trending-topics-radar/topic@0.1.0"
      risk_class: "low"
      preconditions: ["owner's tenant exists"]
      postconditions: ["status changes limited to sent and used"]
      tools:
        - tool_id: "nova.topics.store.list"
          name: "List topics"
          description: "List candidates by subject key, status and age."
          invocation: {protocol: "internal", binding_ref: "binding://nova/topics/store-list", operation: "list"}
          input_schema_ref: "schema://nova/daily-ai-topic-brief/topic-query@0.1.0"
          output_schema_ref: "schema://nova/trending-topics-radar/topic@0.1.0"
          objects:
            - {object_id: "nova.topics.topic", name: "Topic candidate", description: "Stored trending item", operations: ["read"], scope_rules: ["owner's tenant only"], schema_ref: "schema://nova/trending-topics-radar/topic@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/daily-ai-topic-brief/topic-query@0.1.0", output_schema_ref: "schema://nova/trending-topics-radar/topic@0.1.0", constraints: ["read-only"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["topics:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 10, max_attempts: 3, rate_limits: [], error_codes: ["store_unavailable"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["only own-tenant rows"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}
        - tool_id: "nova.topics.store.set_status"
          name: "Set topic status"
          description: "Mark items sent (with sent_in_brief_at) or used on the owner's pick."
          invocation: {protocol: "internal", binding_ref: "binding://nova/topics/store-status", operation: "set_status"}
          input_schema_ref: "schema://nova/daily-ai-topic-brief/topic-status@0.1.0"
          output_schema_ref: "schema://nova/trending-topics-radar/topic@0.1.0"
          objects:
            - {object_id: "nova.topics.topic", name: "Topic candidate", description: "Stored trending item", operations: ["update"], scope_rules: ["status and sent_in_brief_at only", "items in today's brief only"], schema_ref: "schema://nova/trending-topics-radar/topic@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/daily-ai-topic-brief/topic-status@0.1.0", output_schema_ref: "schema://nova/trending-topics-radar/topic@0.1.0", constraints: [], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["topics:write"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["topic status changed"], idempotency: "required", timeout_seconds: 10, max_attempts: 3, rate_limits: [], error_codes: ["not_found"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["status read back"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.research.fetch"
      name: "Page fetch"
      description: "Read a public page to ground an item's line."
      intent_examples: []
      input_schema_ref: "schema://nova/daily-ai-topic-brief/fetch-input@0.1.0"
      output_schema_ref: "schema://nova/daily-ai-topic-brief/page@0.1.0"
      risk_class: "low"
      preconditions: ["public URL"]
      postconditions: ["text or headline_only marker"]
      tools:
        - tool_id: "nova.research.fetch.get"
          name: "Fetch page"
          description: "HTTP GET, size cap, HTML stripped to text, no logins."
          invocation: {protocol: "internal", binding_ref: "binding://nova/research/fetch", operation: "get"}
          input_schema_ref: "schema://nova/daily-ai-topic-brief/fetch-input@0.1.0"
          output_schema_ref: "schema://nova/daily-ai-topic-brief/page@0.1.0"
          objects:
            - {object_id: "nova.research.source", name: "Fetched page", description: "Public page text (transient)", operations: ["read"], scope_rules: ["public pages only", "not stored"], schema_ref: "schema://nova/daily-ai-topic-brief/page@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/daily-ai-topic-brief/fetch-input@0.1.0", output_schema_ref: "schema://nova/daily-ai-topic-brief/page@0.1.0", constraints: ["read-only"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["web:fetch:public"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["HTTP request to the source site"], idempotency: "not_applicable", timeout_seconds: 15, max_attempts: 2, rate_limits: [], error_codes: ["http_error", "too_little_text"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["text at least 500 characters or headline_only"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.brief.compose"
      name: "Brief writer"
      description: "Write one grounded line per selected item."
      intent_examples: ["send today's brief now"]
      input_schema_ref: "schema://nova/daily-ai-topic-brief/compose-input@0.1.0"
      output_schema_ref: "schema://nova/daily-ai-topic-brief/brief-result@0.1.0"
      risk_class: "medium"
      preconditions: ["pre-flight plan available"]
      postconditions: ["model_used and fallback_used recorded"]
      tools:
        - tool_id: "nova.brief.compose.write"
          name: "Write brief"
          description: "Lines from title, snippet and fetched text only; primary, then declared fallback on a different provider, then a deterministic headlines-only template."
          invocation: {protocol: "internal", binding_ref: "binding://nova/brief/write-primary", operation: "write"}
          input_schema_ref: "schema://nova/daily-ai-topic-brief/compose-input@0.1.0"
          output_schema_ref: "schema://nova/daily-ai-topic-brief/brief-result@0.1.0"
          objects:
            - {object_id: "nova.brief.brief", name: "Brief", description: "Daily brief text and metadata", operations: ["create"], scope_rules: ["owner's run record and channel only"], schema_ref: "schema://nova/daily-ai-topic-brief/brief-result@0.1.0"}
          variants:
            - {variant_id: "primary", binding_ref: "binding://nova/brief/write-primary", description: "Owner-chosen tier (default medium) on provider A", compatible_environments: ["TBD"], input_schema_ref: "schema://nova/daily-ai-topic-brief/compose-input@0.1.0", output_schema_ref: "schema://nova/daily-ai-topic-brief/brief-result@0.1.0", constraints: ["1 retry for transient errors"], fallback_variant_id: "fallback"}
            - {variant_id: "fallback", binding_ref: "binding://nova/brief/write-fallback", description: "MANDATORY: same tier on provider B — different company, separate account and credit balance; used once on provider-side failure only; disclosed in the brief footer", compatible_environments: ["TBD"], input_schema_ref: "schema://nova/daily-ai-topic-brief/compose-input@0.1.0", output_schema_ref: "schema://nova/daily-ai-topic-brief/brief-result@0.1.0", constraints: ["provider and billing account differ from primary", "lower tier only with recorded owner approval", "fallback_used disclosed"], fallback_variant_id: "headlines-only"}
            - {variant_id: "headlines-only", binding_ref: "binding://nova/brief/headlines-template", description: "Deterministic template (no model): headlines with links, labelled 'AI summaries unavailable today'", compatible_environments: [], input_schema_ref: "schema://nova/daily-ai-topic-brief/compose-input@0.1.0", output_schema_ref: "schema://nova/daily-ai-topic-brief/brief-result@0.1.0", constraints: ["always paired with a failure alert"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["llm:invoke:primary", "llm:invoke:fallback"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["item text sent to the writing provider"], idempotency: "not_applicable", timeout_seconds: 45, max_attempts: 3, rate_limits: ["one brief per owner per day", "per-run token cap TBD"], error_codes: ["auth_failed", "credit_exhausted", "rate_limited", "provider_5xx", "timeout", "empty_completion"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["model_used recorded", "footer present when fallback used"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.brief.verify"
      name: "Brief verifier"
      description: "Check the brief before delivery."
      intent_examples: []
      input_schema_ref: "schema://nova/daily-ai-topic-brief/brief-result@0.1.0"
      output_schema_ref: "schema://nova/daily-ai-topic-brief/verify-report@0.1.0"
      risk_class: "low"
      preconditions: ["brief present"]
      postconditions: ["all checks pass or corrections applied"]
      tools:
        - tool_id: "nova.brief.verify.check"
          name: "Check brief"
          description: "Item count, link provenance, grounding of names and numbers, length and fallback footer."
          invocation: {protocol: "internal", binding_ref: "binding://nova/brief/verify", operation: "check"}
          input_schema_ref: "schema://nova/daily-ai-topic-brief/brief-result@0.1.0"
          output_schema_ref: "schema://nova/daily-ai-topic-brief/verify-report@0.1.0"
          objects:
            - {object_id: "nova.brief.brief", name: "Brief", description: "Daily brief text and metadata", operations: ["read"], scope_rules: ["run only"], schema_ref: "schema://nova/daily-ai-topic-brief/brief-result@0.1.0"}
          variants:
            - {variant_id: "default", description: "Deterministic rules; only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/daily-ai-topic-brief/brief-result@0.1.0", output_schema_ref: "schema://nova/daily-ai-topic-brief/verify-report@0.1.0", constraints: [], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["topics:read"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: [], idempotency: "not_applicable", timeout_seconds: 5, max_attempts: 1, rate_limits: [], error_codes: ["ungrounded_line", "foreign_link", "missing_footer", "too_long"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["100% of checks pass after corrections"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.notify.owner"
      name: "Owner notification"
      description: "Deliver the brief or failure alerts to the owner."
      intent_examples: []
      input_schema_ref: "schema://nova/daily-ai-topic-brief/brief-result@0.1.0"
      output_schema_ref: "schema://nova/daily-ai-topic-brief/delivery@0.1.0"
      risk_class: "low"
      preconditions: ["owner channel configured"]
      postconditions: ["delivery receipt"]
      tools:
        - tool_id: "nova.notify.owner.send"
          name: "Notify owner"
          description: "Send the brief to the owner's chat; failure alerts from a fixed template; secondary channel for alerts when chat fails."
          invocation: {protocol: "internal", binding_ref: "binding://nova/notify/owner", operation: "send"}
          input_schema_ref: "schema://nova/daily-ai-topic-brief/brief-result@0.1.0"
          output_schema_ref: "schema://nova/daily-ai-topic-brief/delivery@0.1.0"
          objects:
            - {object_id: "nova.notify.message", name: "Owner message", description: "Brief or alert to the owner", operations: ["create"], scope_rules: ["owner channels only"], schema_ref: "schema://nova/daily-ai-topic-brief/delivery@0.1.0"}
          variants:
            - {variant_id: "default", description: "Owner chat; brief delivery", compatible_environments: [], input_schema_ref: "schema://nova/daily-ai-topic-brief/brief-result@0.1.0", output_schema_ref: "schema://nova/daily-ai-topic-brief/delivery@0.1.0", constraints: ["one brief per day"], fallback_variant_id: null}
            - {variant_id: "template-alert", description: "Failure alert from a fixed template; no LLM dependency", compatible_environments: [], input_schema_ref: "schema://nova/daily-ai-topic-brief/failure-alert@0.1.0", output_schema_ref: "schema://nova/daily-ai-topic-brief/delivery@0.1.0", constraints: ["one alert per stage per day"], fallback_variant_id: "secondary-channel"}
            - {variant_id: "secondary-channel", binding_ref: "binding://nova/notify/owner-secondary", description: "Optional owner's second channel; failure alerts only, only when chat fails", compatible_environments: [], input_schema_ref: "schema://nova/daily-ai-topic-brief/failure-alert@0.1.0", output_schema_ref: "schema://nova/daily-ai-topic-brief/delivery@0.1.0", constraints: ["alerts only", "owner's own address only"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["notify:owner", "notify:owner:secondary"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["message delivered to the owner"], idempotency: "required", timeout_seconds: 15, max_attempts: 3, rate_limits: ["one brief per day", "one alert per stage per day"], error_codes: ["channel_unavailable"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["delivery receipt received"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}

    - capability_id: "nova.ops.jobs"
      name: "Job run registry and watcher"
      description: "Record run outcomes and independently detect missed or failed runs."
      intent_examples: []
      input_schema_ref: "schema://nova/daily-ai-topic-brief/run-record@0.1.0"
      output_schema_ref: "schema://nova/daily-ai-topic-brief/run-record@0.1.0"
      risk_class: "low"
      preconditions: ["watcher installed with the brief job"]
      postconditions: ["every scheduled day closes with a delivered brief or alert"]
      tools:
        - tool_id: "nova.ops.jobs.heartbeat"
          name: "Record run"
          description: "Write status, model used, fallback used, failure stage and consecutive-failure count."
          invocation: {protocol: "internal", binding_ref: "binding://nova/ops/jobs-heartbeat", operation: "heartbeat"}
          input_schema_ref: "schema://nova/daily-ai-topic-brief/run-record@0.1.0"
          output_schema_ref: "schema://nova/daily-ai-topic-brief/run-record@0.1.0"
          objects:
            - {object_id: "nova.ops.run_record", name: "Run record", description: "Outcome of one scheduled run", operations: ["create"], scope_rules: ["owner's jobs only"], schema_ref: "schema://nova/daily-ai-topic-brief/run-record@0.1.0"}
          variants:
            - {variant_id: "default", description: "Only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/daily-ai-topic-brief/run-record@0.1.0", output_schema_ref: "schema://nova/daily-ai-topic-brief/run-record@0.1.0", constraints: ["written on every path"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["jobs:heartbeat"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["run record created"], idempotency: "required", timeout_seconds: 10, max_attempts: 3, rate_limits: [], error_codes: ["registry_unavailable"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["record readable by run_id"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}
        - tool_id: "nova.ops.jobs.watch"
          name: "Watch for missed runs"
          description: "Separate job at send_time + 30 min: alert if no run record or a failed_unreported record exists."
          invocation: {protocol: "internal", binding_ref: "binding://nova/ops/jobs-watch", operation: "watch"}
          input_schema_ref: "schema://nova/daily-ai-topic-brief/run-record@0.1.0"
          output_schema_ref: "schema://nova/daily-ai-topic-brief/failure-alert@0.1.0"
          objects:
            - {object_id: "nova.ops.run_record", name: "Run record", description: "Outcome of one scheduled run", operations: ["read"], scope_rules: ["owner's jobs only"], schema_ref: "schema://nova/daily-ai-topic-brief/run-record@0.1.0"}
          variants:
            - {variant_id: "default", description: "Independent of the brief job and both model providers; only the default variant is supported", compatible_environments: [], input_schema_ref: "schema://nova/daily-ai-topic-brief/run-record@0.1.0", output_schema_ref: "schema://nova/daily-ai-topic-brief/failure-alert@0.1.0", constraints: ["no LLM dependency"], fallback_variant_id: null}
          authorization: {required: true, identity_provider: "TBD", required_scopes: ["jobs:watch", "notify:owner"], consent_required: false, grant_ref: null, tenant_binding_required: true}
          execution: {side_effects: ["alert to the owner when a run is missing or unreported"], idempotency: "required", timeout_seconds: 10, max_attempts: 3, rate_limits: ["one missed_run alert per day"], error_codes: ["registry_unavailable", "channel_unavailable"]}
          verification: {health_check_ref: null, test_refs: ["TBD"], success_assertions: ["alert delivered by send_time + 30 min when no receipt exists"]}
          availability: {status: "unverified", last_verified_at: null, evidence_refs: []}
